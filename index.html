<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4EF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gestión" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>Sistema de Gestión · Torremolinos</title>
    <meta name="description" content="Cada proceso, cada meta, cada mes, en un solo lugar. Indicadores, capacitaciones y auditoría de la Finca Torremolinos." />

    <!-- Cómo se ve el enlace cuando alguien lo comparte (WhatsApp, Slack, correo, redes).
         La imagen debe ser una dirección completa, no relativa: por eso se usa el marcador URL_PUBLICA,
         que vite.config.js reemplaza al compilar con la dirección real de la aplicación. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Finca Torremolinos" />
    <meta property="og:title" content="Sistema de Gestión · Finca Torremolinos" />
    <meta property="og:description" content="Cada proceso, cada meta, cada mes, en un solo lugar." />
    <meta property="og:image" content="%URL_PUBLICA%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sistema de Gestión de la Finca Torremolinos: el año mes a mes alrededor del logo." />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sistema de Gestión · Finca Torremolinos" />
    <meta name="twitter:description" content="Cada proceso, cada meta, cada mes, en un solo lugar." />
    <meta name="twitter:image" content="%URL_PUBLICA%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
